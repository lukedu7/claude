<title>Projeto Verão 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#edf1f0; --surface:#fafcfb; --surface-2:#e3eae9; --ink:#11232a; --ink-2:#465b61; --ink-3:#6c8085; --line:#cdd8d7;
  --accent:#0a6b76; --accent-ink:#ffffff; --accent-soft:#d2e9eb;
  --sun:#8a5d12; --sun-soft:#f3e5c8; --sun-mark:#d39a36;
  --good:#276f40; --good-soft:#d9ede0; --warn:#8f580a; --warn-soft:#f5e3c6; --bad:#a13a33; --bad-soft:#f4dad7;
  --band:rgba(10,107,118,.13);
  --shadow:0 1px 2px rgba(17,35,42,.05),0 8px 24px rgba(17,35,42,.06);
  --r:10px;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0b1417; --surface:#111d21; --surface-2:#19282d; --ink:#e3ecea; --ink-2:#a9babc; --ink-3:#7f9396; --line:#25373c;
    --accent:#4db7c2; --accent-ink:#04171a; --accent-soft:#12363a;
    --sun:#e6bb6d; --sun-soft:#3a2e18; --sun-mark:#e0ad55;
    --good:#6cc98b; --good-soft:#15301f; --warn:#e8ac5a; --warn-soft:#3a2a12; --bad:#ee857b; --bad-soft:#3b1a17;
    --band:rgba(77,183,194,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b1417; --surface:#111d21; --surface-2:#19282d; --ink:#e3ecea; --ink-2:#a9babc; --ink-3:#7f9396; --line:#25373c;
  --accent:#4db7c2; --accent-ink:#04171a; --accent-soft:#12363a;
  --sun:#e6bb6d; --sun-soft:#3a2e18; --sun-mark:#e0ad55;
  --good:#6cc98b; --good-soft:#15301f; --warn:#e8ac5a; --warn-soft:#3a2a12; --bad:#ee857b; --bad-soft:#3b1a17;
  --band:rgba(77,183,194,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:clamp(1.6rem,4.2vw,2.2rem);text-transform:uppercase}
h3{font-size:1.3rem;text-transform:uppercase;letter-spacing:.03em}
h4{font-size:1.02rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand-mark{font-family:var(--display);font-weight:700;font-size:1.85rem;letter-spacing:.05em;line-height:1}
.brand-mark span{color:var(--accent)}
.brand-sub{color:var(--ink-2);font-size:.88rem}
.hstat{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter{display:flex;gap:3px;align-items:flex-end;height:20px}
.meter i{display:block;width:9px;height:12px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.meter i.done{background:var(--accent);border-color:var(--accent)}
.meter i.now{background:var(--sun-mark);border-color:var(--sun-mark);height:20px}
.hlabel{font:600 .95rem/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-3)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.ok::before{background:var(--good)}
.sync.saving::before{background:var(--sun-mark)}
.sync.warn::before{background:var(--warn)}
.tabs{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:none;font:600 1.05rem/1 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 10px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* layout */
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
.view{display:grid;gap:34px}
.sec{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.lede{color:var(--ink-2);max-width:70ch}
.muted{color:var(--ink-3)}
.small{font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.lift{box-shadow:var(--shadow)}
.panel > h3 + *{margin-top:10px}
.stack{display:grid;gap:12px;min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.01em}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.sun{background:var(--sun-soft);color:var(--sun)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.tile .v{font:700 2.1rem/1.05 var(--display);font-variant-numeric:tabular-nums}
.tile .v small{font-size:1rem;font-weight:600;color:var(--ink-2);margin-left:2px}
.tile .s{font-size:.84rem;color:var(--ink-2)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td.cur{box-shadow:inset 3px 0 0 var(--sun-mark)}

ul.clean{margin:0;padding-left:1.15em;display:grid;gap:6px}
ul.clean li::marker{color:var(--accent)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
ol.steps > li{counter-increment:st;display:grid;grid-template-columns:2rem 1fr;gap:8px;align-items:start}
ol.steps > li::before{content:counter(st);font:700 1.25rem/1.4rem var(--display);color:var(--accent);text-align:center;border:1.5px solid var(--accent);border-radius:6px;height:1.6rem}

details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.fold > summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 1.08rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"+";font:600 1.4rem/1 var(--display);color:var(--ink-3)}
details.fold[open] > summary::after{content:"–"}
details.fold > .fold-body{padding:0 16px 16px;display:grid;gap:10px}
details.mini > summary{cursor:pointer;color:var(--accent);font-size:.88rem;font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.mini > summary::-webkit-details-marker{display:none}
details.mini > summary::before{content:"›";display:inline-block;transition:transform .15s}
details.mini[open] > summary::before{transform:rotate(90deg)}
details.mini > div{margin-top:8px}

.btn{appearance:none;font:600 .92rem/1 var(--body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.84rem}
.icon{appearance:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.6rem/1 var(--display);cursor:pointer;flex:none}
.icon:hover{border-color:var(--ink-3)}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:600 .85rem var(--body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 .95rem/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:8px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

input[type=number],input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::placeholder{color:var(--ink-3);opacity:.75}
.check{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--ink-3);border-radius:6px;display:inline-grid;place-content:center;cursor:pointer;margin:0;background:var(--surface)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.toggle{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;margin:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:left .15s}
.toggle:checked{background:var(--accent-soft);border-color:var(--accent)}
.toggle:checked::after{left:20px;background:var(--accent)}

/* hoje */
.daybar{display:flex;align-items:center;gap:12px}
.daybar-mid{flex:1;min-width:0;display:grid;gap:6px}
.daybar-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.strip > div{padding:10px 14px;border-left:1px solid var(--line);display:grid;gap:2px;min-width:0}
.strip > div:first-child{border-left:0}
.strip .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.strip .v{font:700 1.45rem/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.strip .s{font-size:.8rem;color:var(--ink-2)}
@media (max-width:620px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip > div:nth-child(3){border-left:0}.strip > div:nth-child(n+3){border-top:1px solid var(--line)}}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar > i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* logger */
.logger{display:grid;gap:4px}
.lg-head{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ex{border-bottom:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
.ex:last-of-type{border-bottom:0}
.ex-top{display:flex;justify-content:space-between;gap:6px 12px;align-items:baseline;flex-wrap:wrap}
.ex-name{font-weight:700;font-size:1.06rem;line-height:1.25}
.ex-name .sub{display:block;font-weight:500;font-size:.82rem;color:var(--warn)}
.ex-meta{font:600 1rem/1.2 var(--display);letter-spacing:.03em;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sets{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.set{display:flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:8px;padding:6px 8px}
.set b{font:700 .9rem/1 var(--display);color:var(--ink-3);min-width:1.6em}
.set input{width:3.9em;text-align:center;padding:5px 4px}
.set span{font-size:.78rem;color:var(--ink-3)}
.hint{font-size:.86rem;line-height:1.35;padding:7px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.hint.up{background:var(--good-soft);color:var(--good)}
.hint.hold{background:var(--accent-soft);color:var(--accent)}
.hint.down{background:var(--warn-soft);color:var(--warn)}
.hint strong{font-weight:700}
.done-row{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:2px solid var(--line);font-weight:600}
.cues{margin:0;padding-left:1.1em;font-size:.9rem;color:var(--ink-2);display:grid;gap:3px}

/* meals */
.meal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:2px}
.meal-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.meal-name{font-weight:700}
.meal-time{font:600 .95rem/1 var(--display);color:var(--ink-3);letter-spacing:.04em;margin-right:6px}
.meal-sum{font-size:.88rem;color:var(--ink-2)}
.meal-k{font:600 .95rem/1 var(--display);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.habit{display:flex;align-items:center;gap:10px;padding:7px 0}
.weigh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weigh input{width:6em;font:700 1.3rem/1 var(--display);text-align:center}

.mealcard{display:grid;gap:10px}
.mealcard .tbl{border-radius:8px}
.role{font:600 .72rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em}

/* treino */
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dcell{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);display:grid;gap:3px;min-width:0}
.dcell .d{font:700 .95rem/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.dcell .t{font-weight:700;font-size:.9rem;line-height:1.2;overflow-wrap:anywhere}
.dcell.casa{background:var(--sun-soft);border-color:transparent}
.dcell.casa .d{color:var(--sun)}
.dcell.off{background:transparent;border-style:dashed}
.dcell.now{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:620px){.week7{grid-template-columns:repeat(4,minmax(0,1fr))}}
.phases{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
.phases > div{height:30px;border-radius:4px;display:grid;place-content:center;font:700 .8rem/1 var(--display);color:var(--ink-2);background:var(--surface-2)}
.phases > div.p0{background:var(--accent-soft);color:var(--accent)}
.phases > div.p1{background:var(--accent);color:var(--accent-ink)}
.phases > div.p2{background:var(--sun-soft);color:var(--sun)}
.phases > div.p3{background:var(--ink);color:var(--bg)}
.phases > div.p4{background:var(--warn-soft);color:var(--warn)}
.phases > div.now{outline:2px solid var(--sun-mark);outline-offset:2px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.eq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.eq:first-child{border-top:0}
.eq .nm{font-weight:600}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--ink-3);font:500 11px var(--body);font-variant-numeric:tabular-nums}
.chart .bandp{fill:var(--band)}
.chart .bandl{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;fill:none;opacity:.6}
.chart .pt{fill:var(--ink-3);stroke:var(--surface);stroke-width:2}
.chart .avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .avgdot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .today{stroke:var(--sun-mark);stroke-width:1.5;stroke-dasharray:2 3}
.chart .xh{stroke:var(--ink-2);stroke-width:1}
.chart .lbl{fill:var(--ink-2);font:600 11px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:.84rem;min-width:140px;transform:translate(-50%,-100%);white-space:nowrap}
.tip .tv{font:700 1.15rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tip .tk{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .tk i{display:inline-block;width:14px;height:2.5px;border-radius:2px}
.form-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.form-grid label{display:grid;gap:4px;font-size:.84rem;color:var(--ink-2);font-weight:600}
.cp{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cp:first-child{border-top:0}
.cp .when{font:700 1.05rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.cp.past .when{color:var(--ink-3)}
.cp.now .when{color:var(--accent)}
.rule{display:grid;gap:6px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rule .rt{font:700 1.15rem/1.15 var(--display);text-transform:uppercase;letter-spacing:.03em}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;color:var(--ink)}
.callout.sun{border-left-color:var(--sun-mark);background:var(--sun-soft)}
.shop-row td:first-child{width:40px}
.shop-row.got td{color:var(--ink-3)}
.shop-row.got .food{text-decoration:line-through}
.foot{max-width:1100px;margin:0 auto;padding:0 16px 40px;color:var(--ink-3);font-size:.82rem;display:grid;gap:4px}
.meal.train .tl-mark{width:24px;height:24px;border-radius:6px;background:var(--sun-soft);border:2px solid var(--sun-mark);flex:none}
.meal.train .meal-name{color:var(--sun)}
.agenda{display:grid;gap:6px}
.agenda ul{margin:0}
.tbl.center td,.tbl.center th{text-align:center}
.tbl.center td:first-child,.tbl.center th:first-child{text-align:left}
td.nowrap,th.nowrap{white-space:nowrap}
.step-on{background:var(--good-soft)}
.note-in{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px;min-height:3.2em;resize:vertical}
.hint.bad{background:var(--bad-soft);color:var(--bad)}

<script>
(function(){
'use strict';
var P = window.PLAN;
var DAY = 864e5;
var DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var DOWL = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function today(){ var n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
var START = parse(P.start), END = parse(P.end), TOTAL = P.weeks*7;
function dayIdx(d){ return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - START)/DAY); }
function weekOf(d){ return Math.floor(dayIdx(d)/7)+1; }
function clampW(w){ return Math.max(1, Math.min(P.weeks, w)); }
function weekStart(w){ return addDays(START,(w-1)*7); }
function phaseIdx(w){ w=clampW(w); for(var i=0;i<P.phases.length;i++){ if(w>=P.phases[i].from && w<=P.phases[i].to) return i; } return 0; }
function phaseOf(w){ return P.phases[phaseIdx(w)]; }
function dshort(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function dlong(d){ return DOWL[d.getDay()]+', '+d.getDate()+' de '+MON[d.getMonth()]; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v===''||v==null) return NaN; return Number(String(v).replace(',','.')); }
function f1(n){ return isFinite(n)? n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) : '—'; }
function f0(n){ return isFinite(n)? Math.round(n).toLocaleString('pt-BR') : '—'; }
function fx(n){ return isFinite(n)? n.toLocaleString('pt-BR',{maximumFractionDigits:2}) : '—'; }
function brl(n){ return isFinite(n)? n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) : '—'; }
function sign(n, d){ return isFinite(n)? (n>=0?'+':'−')+(d===0? f0(Math.abs(n)) : f1(Math.abs(n))) : '—'; }
function list(arr, cls){ if(!arr||!arr.length) return ''; return '<ul class="'+(cls||'clean')+'">'+arr.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'; }
function steps(arr){ if(!arr||!arr.length) return ''; return '<ol class="steps">'+arr.map(function(x){return '<li><div>'+x+'</div></li>';}).join('')+'</ol>'; }
function stable(o){ if(o===null||typeof o!=='object') return JSON.stringify(o); if(Array.isArray(o)) return '['+o.map(stable).join(',')+']'; return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+stable(o[k]);}).join(',')+'}'; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function escList(a){ return (a||[]).map(esc); }

/* ---------- armazenamento: cache local + db da conta ---------- */
var LS = {
  get: function(k,d){ try{ var v=localStorage.getItem('v27:'+k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem('v27:'+k, JSON.stringify(v)); }catch(e){} }
};
var COLS = ['workouts','weighins','checks','measures','settings'];
var syncState = 'boot';
function setSync(s){ syncState = s; renderSync(); }
var Store = {
  data:{}, db:null, timers:{}, writing:{}, dirty:{},
  init: function(){ var saved = LS.get('data', {}) || {}; var self=this; COLS.forEach(function(c){ self.data[c] = saved[c] || {}; }); },
  persist: function(){ LS.set('data', this.data); },
  get: function(c,id){ return this.data[c][id]; },
  put: function(c,id,body,silent){
    if(body==null) delete this.data[c][id]; else this.data[c][id] = body;
    this.persist(); this.schedule(c,id);
    if(!silent) rerender();
  },
  schedule: function(c,id){
    if(!this.db) return; var k=c+'/'+id, self=this;
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(function(){ delete self.timers[k]; self.flush(c,id); }, 700);
  },
  pending: function(c,id){ var k=c+'/'+id; return !!(this.timers[k] || this.writing[k]); },
  flush: function(c,id){
    var k=c+'/'+id, self=this;
    if(this.writing[k]){ this.dirty[k]=true; return; }
    this.writing[k]=true; this.dirty[k]=false; setSync('saving');
    var body = this.data[c][id], ref = this.db.doc(k);
    var p = body==null ? ref.delete() : ref.set(clone(body));

      if(code==='unavailable'){ setTimeout(function(){ self.schedule(c,id); }, 1500 + Math.floor(Math.random()*1500)); setSync('saving'); }

      else if(code==='invalid_argument' || code==='not_granted' || code==='revoked'){ setSync('readonly'); }
      else setSync('error');

      self.writing[k]=false;
      if(self.dirty[k]) self.flush(c,id);
    });
  },
  connect: function(){
    var self=this;
    var use = window.claude && typeof window.claude.use === 'function' ? window.claude.use('db') : Promise.resolve(null);
    Promise.resolve(use).then(function(db){
      if(!db){ setSync('local'); return; }
      self.db = db; setSync('ok');

        var first = true;
        db.collection(c).onSnapshot(function(snap){
          var next = {};
          snap.docs.forEach(function(d){ if(d.exists) next[d.id] = clone(d.data()); });
          var local = self.data[c];
          if(first){
            first = false;
            Object.keys(local).forEach(function(id){ if(!(id in next)) self.schedule(c,id); });
          }
          Object.keys(local).forEach(function(id){ if(self.pending(c,id)) next[id] = local[id]; });
          Object.keys(next).forEach(function(id){ if(self.pending(c,id) && !(id in local)) delete next[id]; });
          if(stable(next) !== stable(local)){ self.data[c] = next; self.persist(); rerender(); }
        }, function(){ setSync('local'); });
      });
    }, function(){ setSync('local'); });
  }
};

/* ---------- alimentação ---------- */

  });

function rirFor(ex, w){ if(isDeload(w)) return '4'; var r = phaseOf(w).rir, o = P.rir_week && P.rir_week[String(clampW(w))]; if(o && o[ex.t]) return o[ex.t]; return r[ex.t] || r.c; }

/* histórico do exercício (mesma key), do mais recente para o mais antigo; semana leve não vira referência */
function prevHist(w, sid, ex, max){

      if(e && e.sets && e.sets.some(function(x){ return x && num(x.reps)>0; })) out.push({ week:k, sid:s2, sets:e.sets, v:e.v||'', lim:!!e.lim });
    }

/* meta exata por série */

    var all = done.map(function(x){ return x.kg; }).filter(isFinite);

    if(L) setLv(clampLi(ex, st.lv)); else { setLv(-1); t.kg = (sub && isFinite(ex.alt_kg)) ? ex.alt_kg : (isFinite(st.kg) ? st.kg : NaN); }

    if(!Rs.some(function(x){ return x.fail; }) && Rs[0].W===Rs[1].W && Rs[1].W===Rs[2].W && Rs[0].avg <= Rs[1].avg && Rs[1].avg <= Rs[2].avg){

function loadText(ex, kg, li){ return ex.lv ? esc(ex.lv[li].n) : (isFinite(kg) ? fx(kg)+' kg' : ''); }

  return (ld ? ld+(ex.lv ? ' · ' : ' × ') : '') + t.reps.map(function(r){ return r+u; }).join(' / ');
}
function hintFor(ex, hist, t, w, sub){
  var st = ex.start || {}, u = ex.unit==='s' ? ' s' : '', g = '<strong class="goal">Meta de hoje: '+tgtText(ex, t)+'</strong>', prev = hist[0];
  if(t.kind==='first') return { tone:'', html: g+'1ª vez deste exercício.'+(st.adj && !sub ? ' '+esc(st.adj) : '')+(sub ? ' Carga de partida do substituto.' : '') };
  var R = recOf(ex, prev);
  var last = 'Última vez (S'+prev.week+' · '+esc(P.sessions[prev.sid].short)+'): '+(ex.lv ? esc(ex.lv[R.li].n)+' · ' : (isFinite(R.W) && !R.fail ? fx(R.W)+' kg × ' : ''))+R.done.map(function(x){ return (!ex.lv && isFinite(x.kg) && x.kg!==R.W ? fx(x.kg)+' kg × ' : '')+x.r+u; }).join(' / ')+'.';

/* ---------- peso, semáforo, ajustes ---------- */
var MW = P.adjust.min_weighins;
function weekAvg(w){
  var vals=[]; for(var i=0;i<7;i++){ var v=Store.get('weighins', iso(addDays(weekStart(w),i))); if(v && isFinite(num(v.kg))) vals.push(num(v.kg)); }
  return { n: vals.length, avg: vals.length? vals.reduce(function(a,b){return a+b;},0)/vals.length : NaN };
}
function baseWeight(){
  var vals=[]; for(var i=0;i<3;i++){ var v=Store.get('weighins', iso(addDays(START,i))); if(v && isFinite(num(v.kg))) vals.push(num(v.kg)); }
  return vals.length? vals.reduce(function(a,b){return a+b;},0)/vals.length : P.profile.weight;
}
function rawDelta(k){
  if(k<1) return NaN; var a = weekAvg(k); if(a.n < MW) return NaN;
  if(k===1) return a.avg - baseWeight();
  var p = weekAvg(k-1); if(p.n < MW) return NaN; return a.avg - p.avg;
}
function weekTraffic(k){
  var t = today(), tIso = iso(t), now = new Date(), hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
  var planned=0, done=0, gymPlanned=0, gymDone=0, days=0;
  for(var i=0;i<7;i++){
    var d = addDays(weekStart(k), i); if(d > t) break; days++;
    var isToday = iso(d)===tIso, ms = mealsFor(k, d.getDay()), ck = Store.get('checks', iso(d)) || {};
    ms.forEach(function(m){ var on = !!(ck.meals && ck.meals[m.id]); if(isToday && !on && m.time > hhmm) return; planned++; if(on) done++; });
    var sid = schedFor(k, d.getDay()), s = P.sessions[sid], D = dayCfgW(k, d.getDay());
    if(isMain(s)){ var wd0 = Store.get('workouts', wid(k,sid)); if(!isToday || (wd0 && wd0.done) || (D.train_end && D.train_end <= hhmm)) gymPlanned++; }
  }
  orderFor(k).forEach(function(sid){ if(!isMain(P.sessions[sid])) return; var wd = Store.get('workouts', wid(k,sid)); if(wd && wd.done) gymDone++; });
  gymPlanned = Math.max(gymPlanned, Math.min(gymDone, 4));
  var pct = planned? done/planned : NaN, tone='', label='—';
  if(planned){
    var gOK = gymDone >= gymPlanned, gY = gymDone >= gymPlanned-1;
    if(pct >= 0.9 && gOK){ tone='good'; label='Verde'; } else if(pct >= 0.76 && gY){ tone='warn'; label='Amarelo'; } else { tone='bad'; label='Vermelho'; }
    if(days < 7) label = 'Até agora: '+label.toLowerCase();
  }
  return { planned:planned, done:done, gymDone:gymDone, gymPlanned:gymPlanned, pct:pct, tone:tone, label:label, days:days };
}
function weekStatus(k){
  var a = weekAvg(k), d = rawDelta(k), o = { a:a, delta:d, tone:'', label:'', act:'', steps:0 };
  if(a.n < MW){ o.label = a.n? 'Poucas pesagens ('+a.n+'/7)' : 'Sem pesagens'; o.act = 'São precisas '+MW+' pesagens na semana para decidir.'; return o; }
  if(k <= 2){ o.tone='hold'; o.label='Adaptação'; o.act='S1–S2: não ajuste. Subir 0,5–2 kg aqui é água e glicogênio.'; return o; }
  if(P.adjust.no_adjust.indexOf(k) >= 0){ o.tone='hold'; o.label='Festas'; o.act='Não ajuste: sal e álcool seguram água. Só repita o plano.'; return o; }
  if(!isFinite(d)){ o.label='Sem base'; o.act='A semana anterior precisa de '+MW+' pesagens para comparar.'; return o; }
  var pd = rawDelta(k-1);
  if(d < 0.10){
    if(isFinite(pd) && pd < 0.10){ var tr = weekTraffic(k); if(tr.planned && tr.done/tr.planned < 0.9){ o.tone='warn'; o.label='Parado 2 semanas'; o.act='Não suba ainda: você cumpriu '+tr.done+' de '+tr.planned+' refeições. O problema é aderência. Troque as refeições que falharam pela versão líquida.'; return o; } }
    o.tone='bad'; o.label='Não subiu'; o.act='+2 degraus.'; o.steps=2; return o;
  }
  if(d < 0.20){ o.tone='warn'; o.label='Abaixo'; o.act='+1 degrau.'; o.steps=1; return o; }
  if(k <= 4){ if(d > 0.90){ o.tone='warn'; o.label='Rápido demais'; o.act='−1 degrau.'; o.steps=-1; return o; } o.tone='good'; o.label='OK'; o.act='Não mexa. Até a S4 a creatina ainda puxa água: só se sobe calorias.'; return o; }
  if(d <= 0.40){ o.tone='good'; o.label='Na faixa'; o.act='Não mexa.'; return o; }
  if(d <= 0.60){ if(isFinite(pd) && pd > 0.40){ o.tone='warn'; o.label='Rápido 2 semanas'; o.act='−1 degrau.'; o.steps=-1; } else { o.tone='hold'; o.label='Um pouco rápido'; o.act='Observe: só reduza se repetir na semana que vem.'; } return o; }
  o.tone = isFinite(pd) && pd > 0.60 ? 'bad' : 'warn'; o.label = isFinite(pd) && pd > 0.60 ? 'Rápido demais (2 sem.)' : 'Rápido demais';
  o.act = isFinite(pd) && pd > 0.60 ? '−1 degrau (−2 no total com a semana passada).' : '−1 degrau.'; o.steps = -1; return o;
}
function bandAt(x){
  var B = P.band; for(var i=1;i<B.length;i++){ if(x <= B[i][0]){ var a=B[i-1], b=B[i], t=(x-a[0])/(b[0]-a[0]); return [a[1]+t*(b[1]-a[1]), a[2]+t*(b[2]-a[2])]; } }
  var L = B[B.length-1]; return [L[1], L[2]];
}
function agenda(d){
  var id = iso(d), w = weekOf(d), dow = d.getDay(), t = [];
  (P.agenda[id] || []).forEach(function(x){ t.push(esc(x)); });

function hm(t){ var a = String(t).split(':'); return (+a[0])*60 + (+a[1]||0); }
function tm(n){ n = Math.round(n/5)*5; return pad(Math.floor(n/60))+':'+pad(n%60); }
function waterSlots(ms, D, s){
  var out = [], T = ms.map(function(m){ return hm(m.time); }).sort(function(a,b){ return a-b; });
  var tr = (D.train && s && s.loc!=='off') ? [hm(D.train), hm(D.train_end || D.train)] : null;

  if(!T.length) return out;

  for(var i=0; i<T.length-1; i++){
    var g = T[i+1]-T[i], mid = T[i] + g/2;

}

var CHART = null, chartIdx = -1;
function chartHTML(){

  var kgs = pts.map(function(p){ return p.kg; });
  var ymin = Math.floor(Math.min.apply(null, kgs.concat([base-1]))), ymax = Math.ceil(Math.max.apply(null, kgs.concat([hi(TOTAL)+0.5])));
  var sx = function(x){ return m.l + x/TOTAL*(W-m.l-m.r); }, sy = function(y){ return m.t + (ymax-y)/(ymax-ymin)*(H-m.t-m.b); };
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso diário e média de 7 dias comparados com a faixa-alvo">', y, x;
  s += '<g class="grid">'; for(y=ymin; y<=ymax; y++) s += '<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(y)+'" y2="'+sy(y)+'"></line>'; s += '</g><g class="axis">';

  s += '</g>';
  var up = [], dn = [];

  var path = '', started = false;

  pts.forEach(function(p){ s += '<circle class="pt" cx="'+sx(p.x)+'" cy="'+sy(p.kg)+'" r="4"></circle>'; });

  CHART = { W:W, m:m, pts:pts, avg:avg, sx:sx, lo:lo, hi:hi };

function bindChart(){
  var hit = document.getElementById('hit'), tip = document.getElementById('tip'), xh = document.getElementById('xh'), svg = hit && hit.ownerSVGElement;
  if(!hit || !CHART) return;
  function hide(){ tip.hidden = true; xh.setAttribute('visibility','hidden'); }
  function show(i){
    var C = CHART; if(!C.pts.length){ hide(); return; }
    i = Math.max(0, Math.min(C.pts.length-1, i)); chartIdx = i;
    var p = C.pts[i], a = C.avg[i], x = C.sx(p.x), r = svg.getBoundingClientRect(), k = r.width / C.W;
    xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.setAttribute('visibility','visible');
    tip.hidden = false; tip.style.left = Math.max(80, Math.min(r.width-80, x*k))+'px'; tip.style.top = (C.m.t*k)+'px';
    var d = parse(p.d); tip.innerHTML = '';
    var t1 = document.createElement('div'); t1.className='small muted'; t1.textContent = cap(DOWL[d.getDay()])+' '+dshort(d)+' · semana '+weekOf(d); tip.appendChild(t1);
    var r1 = document.createElement('div'); r1.className='tk'; var k1 = document.createElement('i'); k1.style.background='var(--ink-3)'; r1.appendChild(k1); var v1 = document.createElement('span'); v1.className='tv'; v1.textContent = f1(p.kg)+' kg'; r1.appendChild(v1); r1.appendChild(document.createTextNode(' pesagem')); tip.appendChild(r1);
    if(a){ var r2 = document.createElement('div'); r2.className='tk'; var k2 = document.createElement('i'); k2.style.background='var(--accent)'; r2.appendChild(k2); var v2 = document.createElement('span'); v2.className='tv'; v2.textContent = f1(a.kg)+' kg'; r2.appendChild(v2); r2.appendChild(document.createTextNode(' média 7 dias')); tip.appendChild(r2); }
    var r3 = document.createElement('div'); r3.className='small muted'; r3.textContent = 'Faixa-alvo no dia: '+f1(C.lo(p.x))+'–'+f1(C.hi(p.x))+' kg'; tip.appendChild(r3);
  }
  function nearest(evt){ var r = svg.getBoundingClientRect(), x = (evt.clientX - r.left) * (CHART.W / r.width), best=0, bd=1e9; CHART.pts.forEach(function(p,i){ var dd = Math.abs(CHART.sx(p.x)-x); if(dd<bd){ bd=dd; best=i; } }); return best; }
  hit.addEventListener('pointermove', function(e){ show(nearest(e)); });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', function(){ show(chartIdx<0? CHART.pts.length-1 : chartIdx); });
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft'){ show(chartIdx-1); e.preventDefault(); } if(e.key==='ArrowRight'){ show(chartIdx+1); e.preventDefault(); } });
}
